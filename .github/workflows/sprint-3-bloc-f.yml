name: sprint-3 · bloc-f · qualité GA

on:
  push:
    paths:
      - "src/routes/api/public/hooks/slo-snapshot.ts"
      - "tests/quality/**"
      - "docs/releases/sprint-3/bloc-f/**"
      - ".github/workflows/sprint-3-bloc-f.yml"
  pull_request:
    paths:
      - "src/routes/api/public/hooks/slo-snapshot.ts"
      - "tests/quality/**"

jobs:
  quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOi.example.token
        run: bun run build
      - name: Quality smoke (dry-run)
        run: |
          cd tests/quality
          python fuzz/fuzz_public_endpoints.py --dry-run
          python load/checkout_100rps.py --dry-run
          python visual/visual_regression.py --dry-run