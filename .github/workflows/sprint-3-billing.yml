name: Sprint 3 · Bloc A — Billing Cycle E2E

# Exécute la suite de certification du Bloc A (renewal + dunning) sur toute
# évolution touchant les endpoints cron, templates emails, migrations
# billing_metrics_daily / iptv_lifecycle_events, ou la suite E2E elle-même.
# La suite doit rester verte pour tout PR mergé vers `main`.

on:
  push:
    branches: [main]
    paths:
      - "src/routes/api/public/hooks/renewal-reminders.ts"
      - "src/routes/api/public/hooks/payment-dunning.ts"
      - "src/lib/email-templates/**"
      - "src/lib/rate-limit.server.ts"
      - "supabase/migrations/**"
      - "tests/e2e/sprint-3/**"
      - ".github/workflows/sprint-3-billing.yml"
  pull_request:
    paths:
      - "src/routes/api/public/hooks/renewal-reminders.ts"
      - "src/routes/api/public/hooks/payment-dunning.ts"
      - "src/lib/email-templates/**"
      - "src/lib/rate-limit.server.ts"
      - "supabase/migrations/**"
      - "tests/e2e/sprint-3/**"
  workflow_dispatch:

jobs:
  bloc-a-billing-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run start &
          echo $! > .server.pid
          for i in {1..40}; do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 2
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright pytest
          python -m playwright install chromium

      - name: Run Bloc A E2E — billing lifecycle
        env:
          BASE_URL: http://localhost:8080
        run: python tests/e2e/sprint-3/billing_lifecycle_test.py

      - name: Stop preview server
        if: always()
        run: kill "$(cat .server.pid)" || true